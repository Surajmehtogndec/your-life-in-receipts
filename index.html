<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Digital scrapbook connecting memories via FAIE engine.">
    <title>Your Life, In Receipts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="text-center" role="banner">
        <h1 class="page-title">Your Life, In Receipts 🧾</h1>
        <p class="page-subtitle">Click any fragment to discover its hidden story.</p>
        
        <section class="search-container mt-4" role="search" aria-label="Memory Search">
            <div class="btn-group mb-4 gap-2" role="group" aria-label="Filter Memories" id="filter-buttons">
                <button type="button" class="btn filter-btn active" data-filter="all" aria-pressed="true">Everything</button>
                <button type="button" class="btn filter-btn" data-filter="purchase" aria-pressed="false">Purchases</button>
                <button type="button" class="btn filter-btn" data-filter="music" aria-pressed="false">Music</button>
                <button type="button" class="btn filter-btn" data-filter="household" aria-pressed="false">Notes</button>
            </div>
            <div class="input-group shadow-sm">
                <label for="search-input" class="visually-hidden">Search memories</label>
                <input type="text" id="search-input" class="form-control border-0 py-2" placeholder="Search for a song, shop, or moment..." aria-label="Search field">
            </div>
        </section>
    </header>

    <main role="main">
        <section id="scrapbook-canvas" aria-live="polite" aria-label="Memory Canvas">
            <div id="loading-spinner" class="text-center w-100 mt-5">
                <div class="spinner-border text-secondary" role="status">
                    <span class="visually-hidden">Loading engine data...</span>
                </div>
                <p class="mt-2 text-muted">Gathering fragments...</p>
            </div>
        </section>
        
        <nav class="text-center mt-5 mb-5" id="load-more-container" style="display: none;" aria-label="Pagination">
            <button id="load-more-btn" class="btn btn-dark px-4 py-2 rounded-pill shadow-sm" aria-label="Load more memories">Reveal More</button>
        </nav>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
